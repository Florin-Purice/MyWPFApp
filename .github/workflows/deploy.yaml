name: Deploy

on:
  push:
    tags:
      - "*"

permissions:
  contents: write   

defaults:
  run:
    shell: pwsh

jobs:

  build:
    runs-on: windows-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on

    env:
      Solution_Name: MyWPFApp.slnx
      Test_Project_Path: MyWPFApp.Tests/MyWPFApp.Tests.csproj
      Wap_Project_Directory: MyWPFApp
      Wap_Project_Path: MyWPFApp/MyWPFApp.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.x

    - name: Restore
      run: dotnet restore ${{ env.Wap_Project_Path }}

    - name: Build
      run: dotnet build ${{ env.Wap_Project_Path }} -c Release --no-restore

    - name: Publish
      run: dotnet publish ${{ env.Wap_Project_Path }} -c Release --no-self-contained -r win-x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none --no-build

    - name: Remove .pdb files from publish folder
      run: Remove-Item -Path "./MyWPFApp/bin/Release/net10.0-windows/win-x64/publish/*" -Include "*.pdb" -Recurse -Force

    - name: Rename publish folder
      run: Move-Item -Path "./MyWPFApp/bin/Release/net10.0-windows/win-x64/publish" -Destination "./My WPF App"

    - name: Zip
      run: Compress-Archive -Path "./My WPF App" -DestinationPath ./MyWPFApp_net10_win-x64.zip

    - name: Remove publish directory
      run: Remove-Item -Recurse -Force "./My WPF App"

    - name: Clean
      run: dotnet clean -c Release

    - name: Restore SelfContained
      run: dotnet restore ${{ env.Wap_Project_Path }} -p:SelfContained=true

    - name: Build SelfContained
      run: dotnet build ${{ env.Wap_Project_Path }} -c Release --no-restore

    - name: Publish SelfContained
      run: dotnet publish ${{ env.Wap_Project_Path }} -c Release --self-contained -r win-x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none --no-build

    - name: Remove .pdb files from publish folder
      run: Remove-Item -Path "./MyWPFApp/bin/Release/net10.0-windows/win-x64/publish/*" -Include "*.pdb" -Recurse -Force

    - name: Rename publish folder
      run: Move-Item -Path "./MyWPFApp/bin/Release/net10.0-windows/win-x64/publish" -Destination "./My WPF App"

    - name: Zip SelfContained
      run: Compress-Archive -Path "./My WPF App" -DestinationPath ./MyWPFApp_standalone_win-x64.zip

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        name: MyWPFApp ${{ github.ref_name }}
        draft: false
        prerelease: false
        files: |
          MyWPFApp_net10_win-x64.zip
          MyWPFApp_standalone_win-x64.zip
